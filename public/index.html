<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0C7C3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Đóng hàng · Tây Cát</title>
<link rel="icon" href="/logo.png" type="image/png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<aside>
  <header>
    <h2><img src="/logo.png" alt="Tây Cát"> Cần chuẩn bị</h2>
    <p>Tổng số chưa đóng, gộp tất cả đơn</p>
  </header>
  <div class="shead lbl"><span>Sản phẩm</span><span>Số lượng</span></div>
  <div id="sum"></div>
  <div class="sfoot" id="sfoot"></div>
</aside>
<main>
  <div class="top">
    <div class="brand">
      <img src="/logo.png" alt="Tây Cát">
      <h1>Đóng hàng</h1>
    </div>
    <div class="seg">
      <button class="on" data-tab="open">Đang làm</button>
      <button data-tab="done">Đã xong</button>
    </div>
    <div class="sync" id="sync"></div>
    <button class="btn" id="btn-mix" title="Nhập và xem mã lô MIX 8 vị hôm nay">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.31M14 2v7.31M8.5 2h7M14 9.3a6.5 6.5 0 1 1-4 0"/></svg>
      <span>Lô MIX</span>
    </button>
    <button class="btn" id="rf" data-refresh="1">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>
      <span id="rft">Cập nhật</span>
    </button>
    <div class="user-pill" id="user-pill" style="display:none">
      <div class="user-meta">
        <span class="user-name" id="user-name"></span>
        <span class="user-badge" id="user-badge"></span>
      </div>
      <button class="user-logout" id="btn-logout" title="Đăng xuất" aria-label="Đăng xuất">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>
  <div class="filters">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
      <input type="search" id="q" placeholder="Tìm khách, mã đơn, SĐT..." autocomplete="off">
    </div>
    <div class="date-chips" id="dates">
      <button class="on" data-date="all">Tất cả</button>
      <button data-date="today">Hôm nay</button>
      <button data-date="yesterday">Hôm qua</button>
      <button data-date="7d">7 ngày</button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="demo" id="demo">Chế độ xem thử với dữ liệu mẫu.<button data-reset="1">Đặt lại</button></div>
  <div id="grid"></div>
</main>
<nav id="bnav">
  <button class="on" data-view="orders">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>
    Đơn hàng<b id="bn1">0</b>
  </button>
  <button data-view="sum">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
    Cần chuẩn bị<b id="bn2">0</b>
  </button>
</nav>
<div id="batch-bar"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="batch-modal"><div class="sheet" id="batch-sheet"></div></div>
<div id="mix-modal"><div class="sheet" id="mix-sheet"></div></div>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
