# fly.toml app configuration file generated for taycat on 2026-11-22T18:22:18Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'taycat'
primary_region = 'sin'

[build]
[[mounts]]
  source = 'packing_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'performance-1x'
  memory = '2gb'
