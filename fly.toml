app = 'donghang'
primary_region = 'sin'

[build]
[[mounts]]
  source = 'packing_data'
  destination = '/data'

[http_service]
  internal_port = 300
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "performance-1x"   # 1 Core CPU riêng biệt 100%
  memory = "2gb"            # 2GB RAM